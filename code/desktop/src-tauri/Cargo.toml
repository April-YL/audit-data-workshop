[package]
name = "audit-data-workshop"
version = "0.1.0"
edition = "2021"

[features]
custom-protocol = ["tauri/custom-protocol"]

[lib]
name = "audit_data_workshop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "audit-data-workshop"
path = "src/main.rs"

[[bin]]
name = "workshop-cli"
path = "src/cli.rs"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
csv = "1"
encoding_rs = "0.8"
calamine = "0.31"
duckdb = { version = "=1.4.4", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
